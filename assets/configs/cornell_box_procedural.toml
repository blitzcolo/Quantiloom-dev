# ============================================================================
# Quantiloom - Cornell Box (Procedural Geometry)
# ============================================================================
# Uses built-in Cornell Box scene (no glTF model required)
# Good for testing basic rendering without external assets
# ============================================================================

[renderer]
resolution = [1280, 720]
spp = 1
output = "cornell_box_output.exr"

[spectral]
# ============================================================================
# WARNING: PREVIEW MODE ONLY - NOT SUITABLE FOR QUANTITATIVE ANALYSIS
# ============================================================================
# Single wavelength mode uses RGB-averaged spectral albedo, NOT physically
# measured spectral reflectance. This is intended for visualization ONLY.
#
# For quantitative results, provide measured spectral curves via [spectral_curves].
# ============================================================================
# Available modes:
#   - "rgb"          : RGB rendering with full color (preview quality)
#   - "single"       : Single wavelength grayscale (PREVIEW ONLY, not quantitative)
#   - "swir_fused"   : Short-wave IR fusion 1-2.5μm (PREVIEW ONLY, not quantitative)
#   - "mwir_fused"   : Mid-wave IR fusion 3-5μm (PREVIEW ONLY, not quantitative)
#   - "lwir_fused"   : Long-wave IR fusion 8-12μm (PREVIEW ONLY, not quantitative)
# ============================================================================
mode = "single_wavelength"
wavelength_nm = 550.0

[scene]
# Use built-in Cornell Box preset (no glTF file needed)
preset = "cornell_box"
world_units_to_meters = 1.0  # 1.0=m, 0.01=cm, 0.001=mm

[camera]
position = [0.0, 1.0, 3.8]
look_at = [0.0, 1.0, 0.0]
up = [0.0, 1.0, 0.0]
fov_y = 45.0

[lighting]
sun_direction = [-0.2, 0.9, -0.1]
sun_radiance = [3.0, 3.0, 3.0]
sky_radiance = [0.3, 0.5, 0.8]

[material]
# Default material for all Cornell Box geometry
albedo = [0.8, 0.8, 0.8]
