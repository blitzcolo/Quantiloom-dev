# Cornell Box — SWIR rendering (1400-2400nm)
# Reflected solar dominates; thermal emission negligible at 300K.
# ECOSTRESS reflectance curves cover this band for all 5 materials.

[renderer]
resolution = [1024, 1024]
spp = 64
output = "cornell_box_swir.exr"

[spectral]
mode = "swir_fused"
band = "SWIR"

[scene]
gltf = "H:/Quantiloom-dev/assets/models/cornell_box/cornell_box.gltf"
world_units_to_meters = 0.001
default_temperature_k = 300.0

[camera]
position = [278.0, 273.0, -800.0]
look_at  = [278.0, 273.0, 280.0]
up       = [0.0, 1.0, 0.0]
fov_y    = 39.0

[lighting]
sun_direction = [0.0, 1.0, -0.3]
sun_radiance  = [5.0, 5.0, 5.0]
# The sun's spectrum, as scene data rather than something the renderer
# invents. ASTM G-173 reference terrestrial spectrum: column 4 is the
# direct beam, column 3 is global irradiance and so includes it.
solar_lut = "assets/luts/astmg173.csv"
solar_lut_columns = [4, 3]
solar_lut_diffuse_is_global = true
sky_radiance  = [1.0, 1.0, 1.0]
atmosphere_temperature_k = 300.0

[material]
albedo = [0.5, 0.5, 0.5]

[quality]
fail_on_srgb_upsample = false
log_material_sources = true

[sensor]
enabled = false
