# Indirect-light check, VIS_FUSED. Cornell box, ceiling panel only.
#
# A smaller, faster copy of cornell_box_vis.toml, kept separate so the gate can
# change resolution without touching the scene people actually look at.
#
# The point of this scene as a test is what it does NOT have: no sun, no sky, no
# solar LUT. Its only emitter is the ceiling panel, so every photon that reaches
# any other surface arrived there by bouncing. Before the visible band had an
# environment bounce this frame was the light panel and nothing else -- 0.6% of
# pixels above the noise floor, the rest exactly zero.
#
# (This used to add "and there is no next-event estimation for emissive geometry
# anywhere in the renderer". There is, and it is on by default -- see
# renderer.enable_light_sampling. It does not change what this scene proves,
# since both strategies sample the same panel, but check_nee_mis.py is the one
# that checks their weights agree.)
#
# Check: python scripts/render-tests/check_color_bleed.py cornell_box_vis_bleed_output.exr

# Cornell Box — VIS spectral rendering (380-780nm, CIE XYZ integration)
# Indoor scene illuminated ONLY by the emissive ceiling light panel.
# No directional sun — this is a closed room.

[renderer]
resolution = [512, 512]
spp = 64
output = "cornell_box_vis_bleed_output.exr"

[spectral]
mode = "vis_fused"
basis_file = "H:/Quantiloom-dev/assets/spectral/quantiloom_basis_v3_usgs.qlbin"
materials_json = "H:/Quantiloom-dev/assets/spectral/quantiloom_materials_usgs.json"
band = "VIS"

[scene]
gltf = "H:/Quantiloom-dev/assets/models/cornell_box/cornell_box.gltf"
world_units_to_meters = 0.001

[camera]
position = [278.0, 273.0, -800.0]
look_at  = [278.0, 273.0, 280.0]
up       = [0.0, 1.0, 0.0]
fov_y    = 39.0

[lighting]
sun_direction = [0.0, 1.0, 0.0]
sun_radiance  = [0.0, 0.0, 0.0]
# A closed Cornell box has no sky. It is lit by its own Light Panel material,
# which is what the original scene is; the 0.3 ambient here was standing in for
# an illuminant whose spectrum was never specified.
sky_radiance  = [0.0, 0.0, 0.0]

[material]
albedo = [0.5, 0.5, 0.5]

[quality]
fail_on_srgb_upsample = false
log_material_sources = true

[sensor]
enabled = false

[material_overrides."Light Panel"]
# The lamp, described by a measured standard rather than by a colour. Without
# this the panel's spectrum is emissiveFactor expanded as sigmoid(rgb)*D65 -- a
# computer-graphics convention that nothing measured, and the last place this
# scene asserted a spectrum it had no data for.
#
# D65 rather than a warmer lamp because this box's job is to compare two light
# transports, not to look like a room: it is the white point sRGB is defined
# against, so the panel comes out achromatic and any colour in the render is the
# walls' doing. Binding it also makes the RGB triple honest -- the renderer
# rewrites emissiveFactor to the colour this spectrum integrates to, which for
# D65 is a neutral grey rather than the warm [15, 15, 12] the author typed.
#
# match_luminance (the default) keeps the panel's brightness at what that triple
# said, so the spectrum changes and the exposure does not.
emissive_curve = "d65"
