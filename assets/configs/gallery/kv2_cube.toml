# ============================================================================
# Gallery scene -- the KV-2 as a hyperspectral cube
# ============================================================================
# The ENVI cube of Section VIII-F. Same asset, same camera and same measured
# spectra as the five-band strip; what changes is that the renderer is asked
# for a wavelength axis instead of a band average, and writes it in the
# interleave a remote-sensing tool reads directly.
#
# The cube is the one product in this paper that can be checked against its own
# inputs pixel by pixel: every surface here carries a named ECOSTRESS/ASTER
# curve, so a spectrum pulled out of the cube at a pixel on the hull can be
# plotted against the library curve that pixel's material was bound to. That is
# what `scripts/experiments/e7_cube.py` does, and it is the difference between
# demonstrating that a cube writer runs and showing that the cube carries the
# scene's spectroscopy.
#
# 1100-2500 nm at 20 nm is 71 bands, the window `spectral.band = "SWIR"`
# reconstructs the measured curves over. Past 2500 nm the scene turns
# emission-dominated and a reflectance comparison stops being the right check. Resolution and sample
# count are well below the strip's: a cube is 106 renders, and the subject here
# is the spectral axis rather than the image.
# ============================================================================

[renderer]
resolution = [512, 288]
spp = 64
seed = 21628                      # 0x547C
output = "renders/gallery/kv2_cube.exr"

[spectral]
mode = "multispectral"
band = "SWIR"
basis_file = "assets/spectral/quantiloom_basis_v3_merged.qlbin"
materials_json = "assets/spectral/quantiloom_materials_merged.json"

# THE RANGE IS THE BOUND BAND'S RANGE, and it has to be. `spectral.band`
# selects the window the measured curves are reconstructed over -- the load log
# reports "λ=[1100.0, 2500.0] nm, coverage=1.00" for every material here -- and
# outside that window the reflectance is whatever the fit degrades to rather
# than what the library says. A cube first written across 400-2500 nm with the
# visible curves bound recovered the sand's reflectance correctly below 780 nm
# and then ran flat at 0.20 through NIR and SWIR against a library curve rising
# to 0.45, which is the out-of-band failure of Section IV seen from the other
# side. The cube path and the band-aware convention are in tension: a cube is a
# continuous wavelength axis and the convention binds reflectance per band, so
# one cube covers one band's window. Section VIII-F states this.
[hyperspectral]
wavelength_min_nm = 1100.0
wavelength_max_nm = 2500.0
wavelength_step_nm = 20.0
output_format = "envi_bsq"        # the interleave downstream tools open first
use_gpu_reconstruction = true

[scene]
gltf = "assets/models/desert/desert_kv2.gltf"
world_units_to_meters = 1.0
default_temperature_k = 300.0

[camera]
position = [-7.0, 3.4, 6.5]   # sunward side, 48 deg from the sun; see kv2_desert_lwir.toml
look_at = [0.0, 1.8, 0.0]
up = [0.0, 1.0, 0.0]
fov_y = 40.0

[lighting]
sun_direction = [-0.6857, 0.7232, 0.0819]
sun_radiance = [1.0, 1.0, 1.0]
sky_radiance = [1.0, 1.0, 1.0]
solar_lut = "assets/luts/astmg173.csv"
solar_lut_columns = [4, 3]
solar_lut_diffuse_is_global = true
atmosphere_temperature_k = 313.0

[material]
albedo = [0.5, 0.5, 0.5]

[atmosphere]
preset = "disabled"
sky_model = "clear_sky"
air_temperature_k = 313.0
relative_humidity = 20.0

# ----------------------------------------------------------------------------
# Materials -- identical bindings to assets/configs/gallery/kv2_desert_lwir.toml
# ----------------------------------------------------------------------------

[[materials]]
name = "DesertGround"
ir_emissivity = 0.90
ir_temperature_k = 320.0
spectral_material_type = "quantiloom_merged"
spectral_material_ref = "Brown loamy fine sand (87P3468)"

[[materials]]
name = "hull"
ir_temperature_k = 322.0
spectral_material_type = "quantiloom_merged"
spectral_material_ref = "Olive green paint (0407UUUPNT)"

[[materials]]
name = "turret"
ir_temperature_k = 324.0
spectral_material_type = "quantiloom_merged"
spectral_material_ref = "Olive green paint (0408UUUPNT)"

[[materials]]
name = "track"
ir_temperature_k = 318.0
spectral_material_type = "quantiloom_merged"
spectral_material_ref = "Oxidized Galvanized Steel Metal (0526UUUSTLa)"

[[materials]]
name = "wheels"
ir_temperature_k = 316.0
spectral_material_type = "quantiloom_merged"
spectral_material_ref = "Black unspecified rubber (0833UUURBR)"

# Paint and rubber are dielectrics; the asset declares no metallicFactor, so
# glTF's default of 1.0 stood and kD = (1 - F)(1 - metallic) was discarding most
# of the diffuse lobe the measured reflectance rides on. The track keeps 1.0
# because its sample is oxidised steel, for which the measured hemispherical
# reflectance essentially IS the Fresnel reflectance. Same reasoning, and the
# same values, as kv2_desert_lwir.toml.
[material_overrides.hull]
metallic = 0.0

[material_overrides.turret]
metallic = 0.0

[material_overrides.wheels]
metallic = 0.0

[material_overrides.track]
metallic = 1.0

[thermography]
enabled = false

[sensor]
enabled = false
