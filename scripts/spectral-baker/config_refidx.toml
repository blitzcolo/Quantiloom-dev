# SpectralBaker v3.0 Configuration - RefractiveIndex.info Source
# Converts RefractiveIndex.info (n,k) data to NMF basis functions
# Supports 5 bands: VIS, NIR, SWIR, MWIR, LWIR (0.35-15 µm)

# =============================================================================
# Input Paths
# =============================================================================
[input]
# Data source type: "usgs" or "refractiveindex"
source_type = "refractiveindex"

# RefractiveIndex.info database configuration
refractiveindex_root = "../../assets/refractiveindex/database"
refractiveindex_pattern = "data/main/**/nk/*.yml"  # Glob pattern for nk data files

# =============================================================================
# Processing Parameters
# =============================================================================
[processing]

# Spectral band definitions
# Each band can have its own n_components (basis function count)

[processing.bands.VIS]
range_um = [0.350, 0.780]   # Visible light (350-780 nm)
interval_nm = 2.0           # 2 nm sampling -> 216 samples
n_components = 16           # 16 basis functions

[processing.bands.NIR]
range_um = [0.780, 1.100]   # Near IR (780-1100 nm)
interval_nm = 2.0           # 2 nm sampling -> 161 samples
n_components = 16           # 16 basis functions

[processing.bands.SWIR]
range_um = [1.100, 2.500]   # Short-wave IR (1100-2500 nm)
interval_nm = 2.0           # 2 nm sampling -> 701 samples
n_components = 32           # 32 basis functions

[processing.bands.MWIR]
range_um = [2.500, 6.500]   # Mid-wave IR (2500-6500 nm)
interval_nm = 5.0           # 5 nm sampling -> 801 samples
n_components = 32           # 32 basis functions

[processing.bands.LWIR]
range_um = [6.500, 15.000]  # Long-wave IR (6500-15000 nm)
interval_nm = 10.0          # 10 nm sampling -> 851 samples
n_components = 32           # 32 basis functions

# Default NMF parameters (can be overridden per-band)
[processing.nmf]
init = "nndsvda"            # Deterministic initialization
solver = "cd"               # Coordinate descent (fast)
max_iter = 2000             # Increased for better convergence
tol = 1.0e-4                # Convergence threshold
random_state = 42           # For reproducibility

# =============================================================================
# Output Paths
# =============================================================================
[output]
# Global basis functions (binary, for C++ loader)
basis_file = "../../assets/spectral/quantiloom_basis_refidx_v1.bin"

# Material weights database (JSON, for glTF integration)
material_json = "../../assets/spectral/quantiloom_materials_refidx.json"

# Validation plots directory
plots_dir = "./output/plots_refidx"

# =============================================================================
# Validation Settings
# =============================================================================
[validation]
# Number of worst-performing materials to plot
plot_worst_n_materials = 10

# Number of best-performing materials to plot
plot_best_n_materials = 5

# Export error histogram
export_error_histogram = true
