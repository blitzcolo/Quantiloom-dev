# Merged spectral library: ECOSTRESS + SLUM
#
# Joint NMF bake producing a single basis + materials pair.  Required because
# the renderer can only reference one basis/materials-json pair per scene, and
# we need both ECOSTRESS refs (ground concrete, metals) and SLUM refs (painted
# metals, PVC, brick, asphalt) in the same scene.
#
# The merged output uses NEW filenames so the old ECOSTRESS-only library stays
# on disk and existing renders' config digests remain interpretable.

[input]
source_type = "merged"

[[input.sources]]
source_type = "ecostress"
ecostress_root = "../../assets/spectral/ecospeclib-all"

[[input.sources]]
source_type = "slum"
slum_data_dir = "data/slum"

# Band configuration — identical to config_ecostress.toml so the grid is
# unchanged and ground concrete reconstruction should barely move.
[processing.bands.VIS]
range_um = [0.350, 0.780]
interval_nm = 2.0
n_components = 16

[processing.bands.NIR]
range_um = [0.780, 1.100]
interval_nm = 2.0
n_components = 16

[processing.bands.SWIR]
range_um = [1.100, 2.500]
interval_nm = 2.0
n_components = 32

[processing.bands.MWIR]
range_um = [2.500, 6.500]
interval_nm = 5.0
n_components = 48

[processing.bands.LWIR]
range_um = [6.500, 15.000]
interval_nm = 10.0
n_components = 48

[processing.nmf]
init = "nndsvda"
solver = "cd"
max_iter = 2000
tol = 1.0e-4
random_state = 42

[output]
basis_file = "../../assets/spectral/quantiloom_basis_v3_merged.qlbin"
material_json = "../../assets/spectral/quantiloom_materials_merged.json"
summary_csv = "../../assets/spectral/material_summary_merged.csv"
plots_dir = "./output/plots_merged"

[validation]
plot_worst_n_materials = 10
plot_best_n_materials = 5
export_error_histogram = true
