name: Build Windows

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install CMake
      uses: lukka/get-cmake@latest

    - name: Install Vulkan SDK
      run: |
        $vulkanVersion = "1.3.290.0"
        $installerUrl = "https://sdk.lunarg.com/sdk/download/$vulkanVersion/windows/VulkanSDK-$vulkanVersion-Installer.exe"
        $installerPath = "$env:TEMP\VulkanSDK-Installer.exe"

        Write-Host "Downloading Vulkan SDK $vulkanVersion..."
        Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath

        Write-Host "Installing Vulkan SDK..."
        Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait

        # Add Vulkan SDK to PATH
        $vulkanPath = "C:\VulkanSDK\$vulkanVersion"
        echo "$vulkanPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        # Set environment variable for current session
        $env:VULKAN_SDK = $vulkanPath
        $env:Path += ";$vulkanPath\Bin"

        Write-Host "Vulkan SDK installed at: $vulkanPath"
      shell: pwsh

    - name: Verify DXC installation
      run: |
        dxc --version
      shell: pwsh

    - name: Compile shaders
      run: |
        ./src/shaders/compile_shaders.bat
      shell: cmd

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64
      shell: pwsh

    - name: Build
      run: |
        cmake --build build --config Release -j
      shell: pwsh

    - name: Build summary
      run: |
        Write-Host "Build completed successfully!"
        Write-Host "Build type: Release"
        Write-Host "Generator: Visual Studio 2022"
        Write-Host "CMake: $(cmake --version | Select-Object -First 1)"
      shell: pwsh
