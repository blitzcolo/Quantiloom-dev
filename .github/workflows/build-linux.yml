name: Build Linux

# ============================================================================
# OpenUSD Support (Optional)
# ============================================================================
# This workflow builds WITHOUT OpenUSD by default. USD file loading will return
# an error message indicating OpenUSD is not available.
#
# To enable OpenUSD support:
# 1. Build OpenUSD using scripts/build_openusd.sh (takes 30-60 minutes)
# 2. Cache the build result (see commented section below)
# 3. Set -DUSD_ROOT=/opt/openusd in CMake configure step
#
# OpenUSD adds ~300-500MB to the build and enables:
# - Full USD composition (sublayers, references, payloads, variants)
# - Production-grade USD scene loading (NVIDIA Attic, etc.)
# ============================================================================

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          wget \
          gnupg \
          software-properties-common

    - name: Install latest GCC
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y gcc-14 g++-14
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
        gcc --version
        g++ --version

    - name: Install Vulkan SDK
      run: |
        wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
        sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
        sudo apt-get update
        sudo apt-get install -y vulkan-sdk
        dxc --version

    - name: Compile shaders
      run: |
        chmod +x ./src/shaders/compile_shaders.sh
        ./src/shaders/compile_shaders.sh

    - name: Configure CMake
      run: |
        cmake -B out/Release -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++

    - name: Build
      run: |
        cmake --build out/Release -j

    - name: Build summary
      run: |
        echo "Build completed successfully!"
        echo "Build type: Release"
        echo "Compiler: $(g++ --version | head -n1)"
        echo "CMake: $(cmake --version | head -n1)"
