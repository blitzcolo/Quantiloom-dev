# ============================================================================
# Quantiloom M1 Test Configuration
# ============================================================================
# Example configuration for M1 testing with parametric camera
# ============================================================================

[renderer]
resolution = [1280, 720]
output_path = "m1_output.exr"

[camera]
# Camera position (world space, meters)
position = [0.0, 2.0, -8.0]

# Look-at target point (world space)
lookAt = [0.0, 1.0, 0.0]

# Up vector (typically [0, 1, 0] for Y-up)
up = [0.0, 1.0, 0.0]

# Vertical field of view (degrees)
fovY = 60.0

[lighting]
# Sun direction (FROM surface TO sun, normalized automatically)
sunDirection = [-0.5, 0.8, -0.3]

# Sun radiance (W·sr⁻¹·m⁻²)
sunRadiance = [3.0, 3.0, 3.0]

# Sky background radiance (W·sr⁻¹·m⁻²)
skyRadiance = [0.3, 0.5, 0.8]

[scene]
preset = "MultiObject"  # Options: "CornellBox", "MultiObject", "LightingTest"

# ============================================================================
# Spectral Rendering Mode (Optional - defaults to RGB)
# ============================================================================
# ⚠️  WARNING: Single wavelength and IR modes use RGB-averaged spectral albedo,
#    NOT physically measured spectral reflectance. These modes are PREVIEW QUALITY ONLY.
#    DO NOT use for quantitative analysis.
#
# Available modes:
#   - "rgb"          : RGB rendering (preview quality)
#   - "single"       : Single wavelength grayscale (PREVIEW ONLY, not quantitative)
#   - "mwir_fused"   : Mid-wave IR fusion (PREVIEW ONLY, not quantitative)
#   - "lwir_fused"   : Long-wave IR fusion (PREVIEW ONLY, not quantitative)
#   - "hs_off"       : Hyperspectral offline (QUANTITATIVE - requires measured spectra)
# ============================================================================
# [spectral]
# mode = "single"
# wavelength_nm = 550.0
